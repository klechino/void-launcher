name: Build NØX CLIENT

on:
  push:
    branches:
      - nox-client-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build NØX
        working-directory: nox-client-1.21.11
        run: gradle build --no-daemon

      - name: Upload NØX JAR
        uses: actions/upload-artifact@v4
        with:
          name: nox-client-1.21.11
          path: nox-client-1.21.11/build/libs/*.jar
          if-no-files-found: error
