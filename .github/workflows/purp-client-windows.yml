name: Build PURP Client Windows installer

on:
  push:
    branches: [purp-client-build]
    paths:
      - "purp-01-*.b64"
      - "purp-04-*.b64"
      - "purp-source-02.b64"
      - "purp-source-03.b64"
      - "purp-source-05.b64"
      - "purp-source-06.b64"
      - ".github/workflows/purp-client-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reassemble and validate source archive
        shell: pwsh
        run: |
          @'
          import base64, bz2, io, pathlib, tarfile

          paths = (
              sorted(pathlib.Path(".").glob("purp-01-*.b64"))
              + [pathlib.Path("purp-source-02.b64"), pathlib.Path("purp-source-03.b64")]
              + sorted(pathlib.Path(".").glob("purp-04-*.b64"))
              + [pathlib.Path("purp-source-05.b64"), pathlib.Path("purp-source-06.b64")]
          )
          if len(paths) != 12:
              raise SystemExit(f"Expected 12 verified source chunks, found {len(paths)}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in paths)
          compressed = base64.b64decode(encoded, validate=True)
          raw_tar = bz2.decompress(compressed)
          destination = pathlib.Path("build-source")
          destination.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r:") as archive:
              members = archive.getmembers()
              if not members or not any(m.name.startswith("PURP-Client/") for m in members):
                  raise SystemExit("Unexpected source archive contents")
              archive.extractall(destination)
          print(f"Validated and extracted {len(members)} project files.")
          '@ | Set-Content -Path repair_source.py -Encoding utf8
          python repair_source.py
      - name: Install dependencies
        working-directory: build-source/PURP-Client
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: build-source/PURP-Client
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PURP-Client-Windows-Setup
          path: build-source/PURP-Client/release/*.exe
          if-no-files-found: error
          retention-days: 14
