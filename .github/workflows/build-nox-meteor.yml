name: Build NOX CLIENT 1.21.11

on:
  push:
    branches:
      - nox-meteor-1.21.11
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-nox-meteor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Meteor 1.21.11
        uses: actions/checkout@v4
        with:
          repository: MeteorDevelopment/meteor-client
          ref: 1.21.11
          path: meteor-src
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Rebrand as NOX CLIENT
        working-directory: meteor-src
        shell: python
        run: |
          from pathlib import Path
          import json

          mod = Path("src/main/resources/fabric.mod.json")
          data = json.loads(mod.read_text(encoding="utf-8"))
          data["name"] = "NOX CLIENT"
          data["description"] = "NOX CLIENT — 1.21.11 Fabric utility client."
          authors = data.get("authors", [])
          if "klechino" not in authors:
              authors = ["klechino"] + authors
          data["authors"] = authors
          data["icon"] = "assets/meteor-client/icon.png"
          data["custom"]["meteor-client:color"] = "177, 92, 255"
          mod.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          mc = Path("src/main/java/meteordevelopment/meteorclient/MeteorClient.java")
          text = mc.read_text(encoding="utf-8")
          text = text.replace('public static final String MOD_ID = "meteor-client";',
                              'public static final String MOD_ID = "meteor-client";')
          mc.write_text(text, encoding="utf-8")

          replacements = {
              "Meteor Client": "NOX CLIENT",
              "METEOR CLIENT": "NOX CLIENT",
          }

          roots = [Path("src/main/java"), Path("src/main/resources")]
          text_exts = {".java", ".json", ".properties", ".txt", ".toml", ".md"}
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in text_exts:
                      try:
                          s = p.read_text(encoding="utf-8")
                      except UnicodeDecodeError:
                          continue
                      for a, b in replacements.items():
                          s = s.replace(a, b)
                      p.write_text(s, encoding="utf-8")

      - name: Build
        working-directory: meteor-src
        run: ./gradlew build --no-daemon

      - name: Prepare NOX JAR
        shell: bash
        run: |
          set -e
          mkdir -p dist
          jar="$(find meteor-src/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$jar"
          cp "$jar" dist/NOX-CLIENT-1.21.11.jar
          ls -lh dist/NOX-CLIENT-1.21.11.jar

      - name: Upload NOX JAR
        uses: actions/upload-artifact@v4
        with:
          name: NOX-CLIENT-1.21.11
          path: dist/NOX-CLIENT-1.21.11.jar
          if-no-files-found: error
